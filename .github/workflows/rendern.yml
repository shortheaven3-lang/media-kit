name: Medien rendern

# Faellt eine Job-Datei ins Repository, entsteht daraus alles Weitere von
# selbst. Dasselbe Muster wie in den bestehenden Konten-Repositories: der
# Push ist der Ausloeser, das Ergebnis wird zurueckgeschrieben.
on:
  push:
    paths:
      - 'jobs/**.json'
      - 'marken/**.json'
      - 'vorlagen/**'
      - 'media_kit/**.py'
      - '.github/workflows/rendern.yml'
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diese Formate rendern (Leerzeichen-getrennt, leer = alle)'
        required: false
        default: ''
      neu:
        description: 'Zwischenlager uebergehen und alles neu aufnehmen'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Zwei gleichzeitige Laeufe wuerden beide ergebnisse/ zurueckschreiben und
  # sich gegenseitig den Push wegnehmen.
  group: rendern
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Das Zwischenlager traegt Schriften, Sprachmodell und schon
      # aufgenommene Seiten von Lauf zu Lauf. Ohne das laedt jeder Lauf 2 MB
      # Schriften und 60 MB Sprachmodell neu und nimmt jede Slide noch einmal
      # auf. Der Schluessel enthaelt die run_id, damit jeder Lauf den Stand
      # fortschreibt; restore-keys holt den letzten passenden.
      - name: Zwischenlager
        uses: actions/cache@v6
        with:
          path: .zwischenlager
          key: mediakit-${{ hashFiles('marken/**','vorlagen/**','media_kit/**') }}-${{ github.run_id }}
          restore-keys: |
            mediakit-${{ hashFiles('marken/**','vorlagen/**','media_kit/**') }}-
            mediakit-

      - name: Pakete installieren
        run: |
          pip install --quiet -r requirements.txt -r requirements-stimme.txt
          playwright install --with-deps chromium

      - name: Jobs pruefen
        run: python3 -m media_kit.cli pruefen --alle

      - name: Rendern
        env:
          # Beide optional. Ohne sie bleibt Wikimedia Commons, das keinen
          # Schluessel braucht - und Jobs ohne Foto laufen ohnehin durch.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Die Eingaben gehen ueber die Umgebung in die Shell, nicht ueber
          # ${{ }} mitten in die Befehlszeile. Sonst wuerde GitHub den Text vor
          # dem Ausfuehren einsetzen, und wer den Lauf von Hand startet, koennte
          # ueber das Feld beliebige Befehle unterschieben.
          NUR: ${{ inputs.nur }}
          NEU: ${{ inputs.neu }}
        run: |
          argumente="--alle"
          if [ -n "$NUR" ]; then argumente="$argumente --nur $NUR"; fi
          if [ "$NEU" = "true" ]; then argumente="$argumente --neu"; fi
          python3 -m media_kit.cli rendern $argumente

      # Zurueckgeschrieben wird nur auf main. Sonst sammelt jeder Zweig seine
      # eigenen "Medien gerendert"-Commits, main und der Zweig laufen
      # auseinander, und beim Zusammenfuehren stehen sich zwei Saetze
      # gerenderter Binaerdateien gegenueber. Genau das ist hier passiert.
      # Auf anderen Zweigen bleibt das Artefakt - zum Ansehen reicht das.
      #
      # main ausdruecklich benannt und nicht ueber default_branch: das
      # Repository wurde leer angelegt, und GitHub macht den zuerst gepushten
      # Zweig zum Standard - hier also den Entwicklungszweig. Die Bedingung
      # ueber default_branch griff dadurch genau verkehrt herum. seite.yml
      # nennt main ohnehin beim Namen, jetzt tun es beide.
      - name: Ergebnis committen
        if: github.ref_name == 'main'
        env:
          ZWEIG: ${{ github.ref_name }}
        run: |
          git config user.name 'media-kit-bot'
          git config user.email 'actions@github.com'
          git add ergebnisse
          if git diff --cached --quiet; then
            echo "Nichts geaendert - alle Ergebnisse waren schon aktuell."
            exit 0
          fi
          git commit -m 'Medien gerendert'

          # Zwischen Start des Laufs und diesem Schritt vergehen ein bis zwei
          # Minuten. Wer in dieser Zeit etwas auf denselben Zweig pusht, laesst
          # den Push hier auflaufen: "Updates were rejected ... (fetch first)".
          # Genau das ist beim fuenften Lauf passiert. Der Renderlauf war
          # fehlerfrei, nur das Ergebnis blieb liegen - und der Lauf stand rot
          # da, ohne dass am Beitrag irgendetwas falsch gewesen waere.
          #
          # -X theirs bezieht sich beim Rebase auf den Commit, der neu
          # aufgesetzt wird, also auf unsere frisch gerenderten Dateien. Das
          # ist hier richtig herum: sie sind aus dem aktuellen Stand erzeugt.
          for versuch in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push abgewiesen - hole den Stand und setze neu auf (Versuch $versuch)"
            git pull --rebase -X theirs origin "$ZWEIG" || true
            sleep $((versuch * 3))
          done
          echo "Push auch nach drei Versuchen nicht durchgekommen." >&2
          exit 1

      # Auf Nebenzweigen ist das Artefakt der einzige Weg an die Ergebnisse -
      # deshalb laeuft dieser Schritt immer, auch nach einem Fehlschlag.
      - name: Ergebnisse auch als Artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medien
          path: ergebnisse/
          retention-days: 14
          if-no-files-found: ignore

      # Die Meldung darf den Lauf nicht zusaetzlich rot faerben: sie laeuft nur,
      # wenn ohnehin schon etwas schiefging, und ihr eigenes Scheitern (etwa
      # weil Issues abgeschaltet sind) wuerde die eigentliche Ursache im
      # Protokoll nach oben schieben.
      - name: Fehlschlag melden
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Renderlauf fehlgeschlagen" \
            --body "Protokoll: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
